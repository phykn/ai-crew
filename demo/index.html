<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AI Crew · 잿불 야영지</title>
    <link rel="stylesheet" href="camp.css?v=tabs" />
    <link rel="stylesheet" href="assets/flow-editor.css?v=tabs" />
    <script defer src="assets/flow-editor.js?v=tabs"></script>
    <script defer src="workflow.js?v=tabs"></script>
    <script defer src="camp.js?v=tabs"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span data-icon="fire"></span>AI Crew</div>
      <button type="button" class="mobile-switch glass" id="mobile-switch">
        캠프 보기
      </button>
      <nav aria-label="작업 보기">
        <button data-tab="chat"><span data-icon="chat"></span>대화</button>
        <button data-tab="log"><span data-icon="list"></span>로그</button>
        <button data-tab="memory"><span data-icon="book"></span>메모리</button>
        <button data-tab="flow">
          <span data-icon="flow"></span>워크플로우
        </button>
        <button
          id="session-open"
          title="세션 목록"
          aria-label="세션 목록"
          aria-haspopup="dialog"
        >
          <small id="session-waiting" hidden></small
          ><span data-icon="menu"></span>
        </button>
      </nav>
    </header>
    <main>
      <section class="camp" aria-label="잿불 야영지">
        <div class="land" id="land"><div class="fireglow"></div></div>
        <div class="roster">
          <button class="roster-head" id="roster-head" aria-expanded="true">
            <span data-icon="users"></span><strong>크루</strong
            ><small id="crew-count"></small><span data-icon="down"></span>
          </button>
          <div id="roster-body"></div>
        </div>
        <footer class="scene-foot">
          <div class="camp-name">
            <span data-icon="compass"></span>
            <h1>잿불 야영지</h1>
          </div>
        </footer>
      </section>
      <section class="panel" aria-label="작업 패널">
        <div id="chat" class="pane">
          <div id="tasks"></div>
          <div id="messages" aria-label="비서와의 대화"></div>
          <form id="composer">
            <div id="commands" hidden>
              <button type="button" id="fill-clear">
                <b>/clear</b><span>현재 설정으로 빈 세션 시작</span>
              </button>
            </div>
            <label class="sr" for="draft">비서에게 메시지</label>
            <textarea
              id="draft"
              rows="2"
              placeholder="비서에게 메시지 보내기…"
            ></textarea>
            <span id="target"></span>
            <div class="compose-bottom">
              <button
                type="button"
                id="workspace-open"
                aria-haspopup="dialog"
                title="프로젝트 폴더 선택"
              >
                <span data-icon="folder"></span><span id="project-name"></span
                ><span data-icon="down"></span>
              </button>
              <button
                type="button"
                id="approval-open"
                aria-haspopup="dialog"
                title="승인 모드 선택"
              >
                <span data-icon="shield"></span><span id="approval-name"></span>
              </button>
              <div id="actions"></div>
            </div>
          </form>
        </div>
        <div id="log" class="pane reading" hidden></div>
        <div id="memory" class="pane reading" hidden></div>
        <div id="flow" class="pane" hidden><div id="flow-root"></div></div>
      </section>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <header>
        <h2 id="detail-title"></h2>
        <button class="iconbtn" id="close" aria-label="닫기">
          <span data-icon="close"></span>
        </button>
      </header>
      <div id="detail-body"></div>
    </dialog>
  </body>
</html>
