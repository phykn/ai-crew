<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>AI Crew · 잿불 야영지</title>
    <link rel="stylesheet" href="camp.css" />
    <script defer src="camp.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span data-icon="fire"></span>AI Crew</div>
      <div class="crumb"><i></i><span data-icon="folder"></span>ai-crew</div>
      <div class="bar-end">
        <span class="local"><b></b>로컬 데모</span
        ><button id="session-open" class="subtle">
          <span data-icon="layers"></span><span id="session-name"></span
          ><span data-icon="down"></span>
        </button>
      </div>
    </header>
    <main>
      <section class="camp" aria-label="잿불 야영지">
        <div class="land" id="land"><div class="fireglow"></div></div>
        <div class="roster">
          <button class="roster-head" id="roster-head" aria-expanded="true">
            <span data-icon="users"></span><strong>크루</strong
            ><small id="crew-count"></small><span data-icon="down"></span>
          </button>
          <div id="roster-body"></div>
        </div>
        <footer class="scene-foot">
          <div class="camp-name">
            <span data-icon="compass"></span>
            <h1>잿불 야영지</h1>
          </div>
          <button id="motion" class="glass"></button>
        </footer>
      </section>
      <section class="panel" aria-label="작업 패널">
        <nav aria-label="작업 보기">
          <button data-tab="chat"><span data-icon="chat"></span>대화</button>
          <button data-tab="log"><span data-icon="list"></span>로그</button>
          <button data-tab="memory">
            <span data-icon="book"></span>메모리
          </button>
        </nav>
        <div id="chat" class="pane">
          <div id="tasks"></div>
          <div id="messages" aria-label="비서와의 대화"></div>
          <form id="composer">
            <div id="commands" hidden>
              <button type="button" id="fill-clear">
                <b>/clear</b><span>현재 설정으로 빈 세션 시작</span>
              </button>
            </div>
            <label class="sr" for="draft">비서에게 메시지</label>
            <textarea
              id="draft"
              rows="2"
              placeholder="비서에게 메시지 보내기…"
            ></textarea>
            <div class="compose-bottom">
              <span id="target"></span>
              <div id="actions"></div>
            </div>
          </form>
        </div>
        <div id="log" class="pane reading" hidden></div>
        <div id="memory" class="pane reading" hidden></div>
      </section>
    </main>
    <button class="mobile-switch glass" id="mobile-switch">캠프 보기</button>
    <dialog id="detail">
      <header>
        <h2 id="detail-title"></h2>
        <button class="iconbtn" id="close" aria-label="닫기">
          <span data-icon="close"></span>
        </button>
      </header>
      <div id="detail-body"></div>
    </dialog>
  </body>
</html>
